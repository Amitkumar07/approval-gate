name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e . pytest

      - name: Run tests
        run: pytest tests/ -v

  core-only:
    # The core package (ApprovalGate, audit log, PII scanning,
    # BlockingBackend) has no required dependencies -- this job proves
    # that stays true by installing nothing but the package itself and
    # pytest, no langgraph/requirements.txt. If this job breaks, something
    # added an implicit hard dependency the core isn't supposed to have.
    name: core package, zero optional deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package with no extras
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest

      - name: Run tests that don't require langgraph
        run: pytest tests/ -v --deselect tests/test_backends.py::test_default_backend_is_langgraph_backend
