[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "approval-gate"
version = "0.1.0"
description = "A drop-in approval gate and audit trail for LangGraph agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
]

[project.optional-dependencies]
pii = ["presidio-analyzer>=2.2"]

[tool.setuptools.packages.find]
include = ["approval_gate*"]
