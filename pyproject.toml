[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "approval-gate"
version = "0.1.0"
description = "A drop-in approval gate and audit trail for AI agents -- works with LangGraph, or with no framework at all."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
langgraph = ["langgraph>=0.2.0", "langchain-core>=0.3.0"]
pii = ["presidio-analyzer>=2.2"]

[tool.setuptools.packages.find]
include = ["approval_gate*"]

[tool.setuptools.package-data]
"approval_gate" = ["py.typed"]
